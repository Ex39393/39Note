name: Deploy 39Note Sync Worker

on:
  push:
    branches:
      - master
    paths:
      - 'sync-worker/**'
      - '.github/workflows/deploy-sync-worker.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: sync-worker
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: sync-worker/package-lock.json
      - name: Install Worker dependencies
        run: npm ci
      - name: Run Worker tests
        run: npm test
      - name: Type-check Worker
        run: npm run typecheck
      - name: Build Worker without deploying
        run: npm run build

  deploy:
    if: ${{ vars.SYNC_WORKER_DEPLOY_ENABLED == 'true' }}
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: sync-worker
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: sync-worker/package-lock.json
      - name: Install Worker dependencies
        run: npm ci
      - name: Apply remote D1 migrations
        run: npx wrangler d1 migrations apply 39note-sync-auth --remote
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Deploy sync Worker
        run: npm run deploy
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
