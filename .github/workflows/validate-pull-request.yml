name: Validate 39Note pull requests

on:
  pull_request:

permissions:
  contents: read

jobs:
  application:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit high-severity dependency vulnerabilities
        run: npm audit --audit-level=high

      - name: Run tests
        run: npm test

      - name: Run lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Run isolated paper recovery browser checks
        run: npm run targeted-purge:native

      - name: Build static application
        run: npm run build
        env:
          VITE_BASE_PATH: ${{ github.event.repository.name == format('{0}.github.io', github.repository_owner) && '/' || format('/{0}/', github.event.repository.name) }}
          VITE_WEB_DEPLOYMENT: 'true'
          VITE_39NOTE_SYNC_AUTH_URL: ${{ vars.VITE_39NOTE_SYNC_AUTH_URL }}

      - name: Smoke-test the production application
        run: npm run production-app:native

      - name: Verify bundled Office converter
        run: npm run office-worker:verify-built

  browser-matrix:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Chrome and Edge recovery/browser matrix
        run: npm run browser-matrix:native

  sync-worker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: sync-worker

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: sync-worker/package-lock.json

      - name: Install Worker dependencies
        run: npm ci

      - name: Audit high-severity Worker dependency vulnerabilities
        run: npm audit --audit-level=high

      - name: Run Worker tests
        run: npm test

      - name: Type-check Worker
        run: npm run typecheck

      - name: Build Worker without deploying
        run: npm run build
